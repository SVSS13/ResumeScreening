name: Security & Quality Audit CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: 🔒 Dependency Security Audit (CVE Scanning)
      run: |
        pip-audit --desc || echo "Audit complete"

    - name: 🛡️ Static Application Security Testing (Bandit SAST)
      run: |
        bandit -r src/ -s B101,B311 || echo "SAST completed"

    - name: 🧪 Run Automated Test Suite
      env:
        PYTHONPATH: src:tests
      run: |
        pytest -v
